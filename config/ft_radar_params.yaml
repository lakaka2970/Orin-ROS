# ============================================================================
# FT Radar Framework V2 — 全局参数配置
# ============================================================================
# V2 架构变更:
#   - 文件路径发布: ADC/Camera 写入文件后发布路径, DDS 带宽降低 99.99%
#   - Logging 内置化: 数据采集层 C++ 节点内置 Logging, 无独立 logging_node
#   - 运行模式: FT_DEBUG_MODE / FT_RUNNING_MODE
#   - Logging 模式: ADC_MODE / RD_CELL_LIST_MODE / DET_LIST_MODE / IDLE_MODE
#   - NVMe SSD 双存储: 自动检测 NVMe, 回退 eMMC
#   - V4L2 硬件时间戳: CLOCK_MONOTONIC, 微秒精度
#
# 话题频率概览 (Hz):
#   /adc/file_path                   15 Hz  ← adc_rx (V4L2 硬件帧率)
#   /camera/file_path                15 Hz  ← camera_rx (V4L2 硬件帧率)
#   /vehicle/ego_motion              50 Hz  ← vehicle_data_rx (SocketCAN)
#   /processing/radar/det_list_cuda  15 Hz  ← rsp_cuda (GPU, 66ms 时限)
#   /perception/objects              15 Hz  ← object_detection_3d
#   /visualization/radar/display     15 Hz  ← rviz_radar
#   /visualization/camera/display    15 Hz  ← rviz_image
#   /visualization/ruler              2 Hz  ← rviz_ruler
#   /system/monitor                   1 Hz  ← system_monitor
#   /system/stop_all                 事件   ← rx 节点 (自动停止)
#
# 时间戳机制:
#   SOURCE:  V4L2 v4l2_buffer.timestamp / SocketCAN SIOCGSTAMP (CLOCK_MONOTONIC)
#   PASSTHR: 下游节点透传 header.stamp, 禁止重新生成
#   UNIT:    微秒 (μs), uint64
#
# 作者: zhengyuan.liu
# 日期: 2026-07-26 (V2)
# ============================================================================

# ====================================================================
# 系统全局配置
# ====================================================================
system:
  operation_mode: "FT_DEBUG_MODE"     # FT_DEBUG_MODE | FT_RUNNING_MODE
  logging_mode: "ADC_MODE"            # ADC_MODE | RD_CELL_LIST_MODE | DET_LIST_MODE | IDLE_MODE
  logging_output_dir: ""              # 空=自动检测 NVMe/eMMC
  global_timestamp_source: "monotonic"
  timestamp_unit: "us"
  enable_warmup: true                 # V4L2 warm-up 开关
  warmup_sec: 5.0                     # warm-up 时长 (秒)

# ====================================================================
# 节点: ADC Rx — 雷达 ADC 数据采集 (C++, V4L2 双设备)
# ====================================================================
# 规格: 16T16R (ctrx0 + ctrx1), 32 MiB/帧, 15 Hz
# V2: 文件路径发布 + 内置 ADC Logging + V4L2 硬件时间戳
adc_rx:
  fps: 15
  num_rows: 1024
  num_chirps_per_row: 8
  num_samples_per_chirp: 2048
  frame_size_bytes: 33554432          # 32 MiB
  device_path_ctrx0: "/dev/radar_ctrx0"
  device_path_ctrx1: "/dev/radar_ctrx1"
  capture_width: 8192                 # 4 RX × 2048 samples
  capture_height: 1024                # 512 chirps × 2 groups
  logging_max_frames: 100             # eMMC 模式最大帧数 (NVMe 无限制)

# ====================================================================
# 节点: Camera Rx — 相机数据采集 (C++, Raw V4L2 mmap)
# ====================================================================
# V2: MJPEG 直接写盘, 无 OpenCV 依赖, VIDIOC_S_PARM 硬件帧率控制
camera_rx:
  fps: 15
  image_width: 1920
  image_height: 1080
  device_path: "/dev/camera_capture"
  pixel_format: "MJPG"
  reconnect_interval_frames: 90

# ====================================================================
# 节点: Vehicle Data Rx — 车辆数据采集 (C++, SocketCAN)
# ====================================================================
# V2: 5 报文解析, SIOCGSTAMP 硬件时间戳, 内置 Ego Logging
vehicle_data_rx:
  fps: 50
  timeout_cycles: 1
  can_interface: "can0"
  ego_data_file: "data/ego_motion.csv"
  defaults:
    vx: 0.0
    yaw_rate: 0.0
    steering_angle: 0.0
    ax: 0.0
    ay: 0.0
    gear: 1

# ====================================================================
# 节点: RSP CUDA — 雷达信号处理 (Python + GPU)
# ====================================================================
# V2: 订阅 /adc/file_path, 66ms 处理时限, DDR 队列机制
rsp:
  default_mode: "cuda"

  # 信号处理参数
  range_fft_size: 2048
  doppler_fft_size: 512
  angle_fft_size: 64
  range_resolution_m: 0.1465
  velocity_max_ms: 16.0

  # CFAR 参数
  cfar_threshold_db: 12.0
  cfar_guard_range: 4
  cfar_guard_doppler: 4
  cfar_train_range: 8
  cfar_train_doppler: 8

  # 检测后处理
  min_snr_db: 10.0
  min_range_m: 1.0
  max_range_m: 150.0
  max_detections: 200

  # CUDA 版参数
  cuda:
    processing_fps: 15.0              # V2: 15 Hz (匹配 ADC 帧率)
    snr_threshold: 8.0
    velocity_scale: 0.5

# ====================================================================
# 节点: 3D Object Detection (可选)
# ====================================================================
object_detection_3d:
  cluster_distance: 5.0
  min_cluster_size: 3
  default_box_height: 2.0

# ====================================================================
# 节点: Rviz_Ruler — 标尺参考
# ====================================================================
rviz_ruler:
  publish_hz: 2.0
  ruler_axis: "x"
  ruler_offset: -50.0
  ruler_interval: 20.0
  ruler_length: 300.0
  ruler_font: 0.8
  ruler_color: [0.8, 0.8, 0.8]

# ====================================================================
# 节点: Rviz_radar — 雷达可视化
# ====================================================================
rviz_radar:
  publish_hz: 15.0
  min_z: -5.0
  max_z: 15.0
  marker_lifetime: 1.0
  fixed_frame: "radar"

# ====================================================================
# 节点: Rviz_Image — 图像可视化
# ====================================================================
rviz_image:
  show_overlay: true
  fixed_frame: "camera"

# ====================================================================
# 节点: System Monitor — 系统监控
# ====================================================================
system_monitor:
  monitor_hz: 1.0
  frame_history_size: 100
  adc_expected_period_ms: 66.0
  camera_expected_period_ms: 66.0
  drop_threshold_factor: 1.5
