# ============================================================================
# FT Radar Framework — 全局参数配置
# ============================================================================
# 所有节点的默认参数集中在此管理。可通过以下方式覆盖:
#   1. 直接编辑此文件
#   2. ros2 launch 时传入参数:
#      ros2 launch ft_radar_launch.py rsp_mode:=cuda log_image:=false
#
# ════════════════════════════════════════════════════════════════════════════
# 话题频率概览 (Hz)
# ════════════════════════════════════════════════════════════════════════════
#   /adc/raw_data                    15 Hz  ← adc_rx (32 MiB/帧, ctrx0+ctrx1 16T16R 合并)
#   /camera/image_raw                30 Hz  ← camera_rx
#   /vehicle/ego_motion              50 Hz  ← vehicle_data_rx
#   /processing/radar/det_list       10 Hz  ← rsp_* (⚠ 低于ADC 15Hz)
#   /processing/radar/det_list_cuda  10 Hz  ← rsp_cuda (双路模式)
#   /perception/objects             ~10 Hz  ← object_detection_3d (事件驱动)
#   /visualization/radar/display     10 Hz  ← rviz_radar (定时合成)
#   /visualization/radar/boxes       10 Hz  ← rviz_radar + object_detection_3d
#   /visualization/radar/frame_info  10 Hz  ← rviz_radar
#   /visualization/camera/display   ~30 Hz  ← rviz_image (事件驱动)
#   /visualization/ruler              2 Hz  ← rviz_ruler
#
# ════════════════════════════════════════════════════════════════════════════
# 时间戳机制
# ════════════════════════════════════════════════════════════════════════════
#   SOURCE:  Layer-1 Rx 节点 → time.monotonic_ns() → (sec, nanosec) → header.stamp
#            三节点统一调用 common.monotonic_us_stamp()
#   PASSTHR: Layer-2/3/4 下游节点 → 透传上游 header.stamp，禁止重新生成
#            仅 Rviz_radar / Rviz_Ruler 使用 get_clock().now() 生成可视化时间戳
#   LOGGING: Logging 节点 → 从 header.stamp 提取微秒整数 → 文件名 + CSV timestamp_us
#
# 作者: zhengyuan.liu
# 日期: 2026.6.9
# ============================================================================

# ====================================================================
# 系统全局配置
# ====================================================================
system:
  global_timestamp_source: "monotonic"    # 时钟源: monotonic | ptp
  timestamp_unit: "us"                    # 时间戳单位: 微秒 (μs)

# ====================================================================
# 节点: ADC Rx — 雷达 ADC 数据接收
# ====================================================================
# 规格: 16T16R 拆分 2×8T8R (ctrx0 + ctrx1 双文件), 32 MiB/帧
#   ctrx0: 512 chirps × 2 groups × 4 RX × 2048 samples × 2B = 16 MiB (RX 0-3)
#   ctrx1: 512 chirps × 2 groups × 4 RX × 2048 samples × 2B = 16 MiB (RX 4-7)
#   合并:  1024 chirps × 8 RX × 2048 samples × 2B = 32 MiB
adc_rx:
  fps: 15
  num_rows: 1024                           # 总 chirp: 512 chirps/group × 2 groups
  num_chirps_per_row: 8                    # RX 天线数: ctrx0(4) + ctrx1(4) = 8
  num_samples_per_chirp: 2048
  bin_file_ctrx0: "data/ctrx0_raw.bin"     # 8T8R 半集 0
  bin_file_ctrx1: "data/ctrx1_raw.bin"     # 8T8R 半集 1
  frame_size_bytes: 33554432               # 1024×8×2048×2 = 32 MiB
  data_dir: "data"                         # .bin 文件目录 (相对路径基于 CWD)
  max_preload_files: 30                    # 最多预加载文件数 (~960 MB)
  use_noise_pool: true                     # 无文件时自动回退到噪声池

# ====================================================================
# 节点: Camera Rx — 相机数据接收
# ====================================================================
# 规格: 30 Hz, 约 16 KB/帧
# 注意: `line` 和 `nof_line` 参数当前为占位值，具体格式待确认
camera_rx:
  fps: 30
  frame_size_bytes: 16384                 # 约 16 KB/帧，待确认
  line: 0                                 # 待确认，预留接口
  nof_line: 0                             # 待确认，预留接口

# ====================================================================
# 节点: Vehicle Data Rx — 车辆数据接收
# ====================================================================
# 规格: 50 Hz，含默认值机制
# 超时: 超过 timeout_cycles 个周期未收到有效数据，自动切换为默认值
vehicle_data_rx:
  fps: 50
  timeout_cycles: 3                        # 超时周期数（3周期 = 60ms）
  can_interface: "can0"                     # CAN 接口名 (接入总线后启用)
  defaults:
    vx: 0.0                               # 车速 (m/s)
    yaw_rate: 0.0                         # 偏航角速度 (rad/s)
    steering_angle: 0.0                   # 转向角度 (rad)
    ax: 0.0                               # 纵向加速度 (m/s²)
    ay: 0.0                               # 横向加速度 (m/s²)
    gear: 1                               # 挡位: 1=D

# ====================================================================
# 节点: RSP — 雷达信号处理（双路径）
# ====================================================================
# default_mode: python | cuda | both | both_compare
#   python:        仅启动 Python 版 RSP
#   cuda:          仅启动 CUDA 版 RSP（默认生产模式）
#   both:          双路并行，独立输出话题
#   both_compare:  双路并行 + 自动对比输出差异
rsp:
  default_mode: "cuda"

  # -- 信号处理流水线参数 (共享) --
  # FFT 尺寸
  range_fft_size: 2048                      # Range FFT 点数
  doppler_fft_size: 512                     # Doppler FFT 点数 (= chirps_per_tx)
  angle_fft_size: 64                        # 角度 FFT 点数 (零填充超分辨)

  # 物理参数 (77 GHz 汽车雷达典型值, 待实测校准)
  range_resolution_m: 0.1465                # 距离分辨率 (m), c/(2B)
  velocity_max_ms: 16.0                     # 最大不模糊速度 (m/s), λ/(4*T_chirp)

  # CFAR 检测参数
  cfar_threshold_db: 12.0                   # CFAR 检测阈值 (dB)
  cfar_guard_range: 4                       # Range 维保护单元数
  cfar_guard_doppler: 4                     # Doppler 维保护单元数
  cfar_train_range: 8                       # Range 维参考单元数
  cfar_train_doppler: 8                     # Doppler 维参考单元数

  # 检测后处理
  min_snr_db: 10.0                          # 最小 SNR 阈值 (dB)
  min_range_m: 1.0                          # 最小检测距离 (m), 滤除近场耦合
  max_range_m: 150.0                        # 最大检测距离 (m)
  max_detections: 200                       # 每帧最大检测点数

  # Python 版参数
  python:
    processing_fps: 10.0                    # 处理帧率 (Hz)
    snr_threshold: 10.0                     # SNR 阈值 (dB)
    velocity_scale: 0.5                     # 速度估算缩放因子

  # CUDA 版参数
  cuda:
    processing_fps: 10.0                    # 处理帧率 (Hz)
    snr_threshold: 8.0                      # SNR 阈值 (dB), 更低 = 更高灵敏度
    velocity_scale: 0.5                     # 速度估算缩放因子

# ====================================================================
# 节点: 3D Object Detection — 3D 目标检测（AI 模拟）
# ====================================================================
object_detection_3d:
  cluster_distance: 5.0                   # 欧氏聚类距离阈值 (m)
  min_cluster_size: 3                     # 最小簇点数
  default_box_height: 2.0                 # 默认目标框高度 (m)

# ====================================================================
# 节点: Rviz_Ruler — 标尺参考
# ====================================================================
rviz_ruler:
  publish_hz: 2.0                         # 标尺发布频率 (Hz)
  ruler_axis: "x"                         # 标尺方向: x | y
  ruler_offset: -50.0                     # 正交偏移量 (m)
  ruler_interval: 20.0                    # 标记间隔 (m)
  ruler_length: 300.0                     # 总长度 (m)
  ruler_font: 0.8                         # 字体大小
  ruler_color: [0.8, 0.8, 0.8]           # RGB 颜色 (0~1)

# ====================================================================
# 节点: Rviz_radar — 雷达可视化
# ====================================================================
rviz_radar:
  publish_hz: 10.0                        # 可视化发布频率 (Hz)
  min_z: -5.0                             # 高度色带下限 (m)
  max_z: 15.0                             # 高度色带上限 (m)
  marker_lifetime: 1.0                    # Marker 生命周期 (s)
  fixed_frame: "radar"                    # RViz 固定坐标系

# ====================================================================
# 节点: Rviz_Image — 图像可视化
# ====================================================================
rviz_image:
  show_overlay: true                      # 是否显示叠加信息（帧号、时间戳）
  fixed_frame: "camera"                   # RViz 固定坐标系

# ====================================================================
# 节点: Logging — 数据日志记录
# ====================================================================
# 5 个独立开关分别控制各数据通道的录制启停。
# 可通过 `ros2 param set /logging_node <param> <value>` 运行时动态切换。
#
# 输出目录结构（仅前向中心雷达）:
#   <output_dir>/
#   ├── ego_motion.csv                       # 自车运动，单文件追加
#   ├── calibration/                         # 标定文件
#   │   └── radar_front_center_ft.yaml
#   ├── pc_pcd_radar_front_center/          # 雷达点云 PCD（逐帧）
#   │   └── <timestamp_us>.pcd
#   ├── pc_csv_radar_front_center/          # 雷达点云 CSV（逐帧）
#   │   └── <timestamp_us>.csv
#   ├── obj_csv_radar/                      # 雷达目标 CSV（逐帧）
#   │   └── <timestamp_us>.csv
#   ├── camera_front_center/                # 相机图像（逐帧）
#   │   └── <timestamp_us>.jpg
#   └── adc_data/                           # ADC 原始数据（逐帧）
#       └── <timestamp_us>.bin
#
# 帧数上限策略:
#   ADC:     100 帧 → 约 3.2 GB (100 × 32 MiB)
#   Image:   1000 帧
#   Det_List: 1000 帧
#   Ego_Motion: 1000 帧
#   Obj_List:  1000 帧
# 达到上限后停止记录并输出警告日志
logging:
  output_dir: "output/ft_dataset"            # 输出根目录（相对路径基于工作区根）
  max_frames:
    adc: 100                              # ADC 原始数据最大帧数
    image: 1000                           # 相机图像最大帧数
    det_list: 1000                        # 雷达检测列表最大帧数
    ego_motion: 1000                      # 自车运动数据最大帧数
    obj_list: 1000                        # 3D 目标列表最大帧数
  switches:
    enable_adc: true                      # 开关1: ADC 原始数据录制
    enable_image: true                    # 开关2: 相机图像录制
    enable_det_list: true                 # 开关3: 雷达检测列表录制
    enable_ego_motion: true               # 开关4: 自车运动数据录制
    enable_obj_list: true                 # 开关5: 3D 目标列表录制
  calibration_file: ""                    # 标定文件路径（空字符串=不加载）
